[package]
name = "jisr"
# ملاحظة: النسخة هنا ثابتة (0.1.0) عمداً — لأن تغيّرها يغيّر Cargo.lock
# فيُبطل cache البناء في CI (بناء بارد ~8 دقائق بدل 2).
# النسخة الحقيقية اللي يشوفها المستخدم وتحديث التلقائي: tauri.conf.json
version = "0.1.0"
description = "Jisr — run Windows games on Apple Silicon Macs (Wine + Rosetta 2)"
authors = ["WhoisMelv"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jisr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"   # نافذة اختيار ملف اللعبة (.exe) — بأسلوب النظام الأصلي
tauri-plugin-single-instance = "2" # نمنع فتح نسختين تتخانق على نفس القارورة/ستيم
tauri-plugin-updater = "2"  # تحديث تلقائي موقّع (minisign) — ما يحتاج حساب آبل
tauri-plugin-process = "2" # إعادة تشغيل التطبيق بعد التحديث
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# وقت محلي مقروء في السجل التشخيصي (بدون أي اعتماد على نظام التشغيل)
chrono = "0.4"

# محرّك التنزيل: HTTP مع بث (stream) + ملفات ومؤقتات غير متزامنة + بصمة SHA-256
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "process"] }
sha2 = "0.10"

# فك الضغط الآمن: tar.xz + قراءة tar
# ملاحظة: static إلزامية — تدمج liblzma داخل التطبيق (بدونها يرتبط بمكتبة
# Homebrew الموجودة على سيرفر البناء فقط → ينهار على أجهزة المستخدمين!)
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
# فك أرشيف DXVK (tar.gz) — نفس حراسات المسارات المستخدمة للمحرك
flate2 = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
