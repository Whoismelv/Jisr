# ============================================================
#  تدقيق أمان التبعيات (cargo-audit)
# ============================================================
# نفس قائمة الاستثناءات الموجودة في src-tauri/.cargo/audit.toml.
# السبب: أمر `cargo audit --file <lockfile>` لا يقرأ إعدادات المانيفست،
# لذلك نكتب القائمة في الملف الرسمي .cargo/audit.toml أيضاً.
#
# لماذا نستثني RUSTSEC-2026-0367 / 0368 / 0369؟
#   `zip 4.6.1` فيه 3 ثغرات (منها 9.1 حرجة) في مسار استخراج ZIP.
#   وهو تبعية **لويندوز فقط** من إضافة التحديث
#   (tauri-plugin-updater: [target.'cfg(target_os = "windows")'.dependencies.zip])
#   أي أن:
#   • لا يُبنى على ماك إطلاقاً (ولا يدخل في ملف جسر الماك).
#   • مسار استخراج ZIP لا ينفّذ على macOS (تحديث الماك = .app.tar.gz).
#   • لا يوجد إصدار 4.x مُصلح (الإصلاح في 9.x بينما المطلب ^4).
#   المصدر: https://rustsec.org/advisories/RUSTSEC-2026-0369
[advisories]
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]
