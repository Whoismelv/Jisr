# ============================================================
#  جسر — بناء نسخة الماك (Apple Silicon) على سيرفرات GitHub
#  • الناتج: ملف .dmg + حزمة تحديث موقّعة + إصدار (Release) جاهز
#  • التشغيل: من تبويب Actions (يدوي) أو بدفع وسم إصدار v*
#  • صيانة عند إصدار جديد: غيّر tag_name + الاسم تحت، ثم ادفع نفس الوسم
#  • حارس أمان: يفشّل البناء لو التطبيق اعتمد على مكتبة خارج مكتبات النظام
#    (درس أول تجربة حقيقية: liblzma من Homebrew سيرفر البناء)
#
#  ⚡ السرعة (أُعيد تصميمها ٢٠٢٦-١٠-٢٠ — كانت ٧.٥ دقيقة، والهدف ~٢-٣):
#     1) build  — بناء + اختبارات + تجهيز الملفات   (وظيفة واحدة)
#     2) audit  — تدقيق تبعيات Rust                 (تعمل بالتوازي مع البناء)
#     3) release— ينشر الـdmg + latest.json         (ينتظر الاثنين)
#     ⇒ الزمن = أبطأ الوظيفة بدل مجموعها.
#
#  أسباب البطء (كلها عولجت):
#     • `lto = true` + `codegen-units = 1` = أبطأ إعدادات الرابط (الحل: thin LTO)
#     • الاختبارات كانت ببروفايل dev منفصل ⇒ بناء مزدوج (الحل: نفس بروفايل البناء)
#     • `cargo audit` كان ينسخ قاعدة الثغرات (أرشيف ضخم) كل مرة (الحل: كاش يومي)
# ============================================================
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  checks: write

# لو تعلّق وسم أحدث — ألغِ القديم (توفير وقت وطابور)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1) البناء + الاختبارات (المسار الحرج — كل شيء في وظيفة واحدة)
  # ============================================================
  build:
    name: "بناء التطبيق + اختبارات"
    runs-on: macos-14
    env:
      # مفتاح توقيع حزمة التحديث (minisign) — سر داخل GitHub فقط
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # بلا ملفات تصحيح أخطاء: حجم أصغر وكاش أسرع (النتيجة الجريبية مطابقة)
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache (يبني أسرع)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: مكتبات الواجهة
        run: npm ci

      - name: "🛡️ فحص ثغرات حزم npm"
        run: npm audit --audit-level=high

      - name: "🔨 بناء التطبيق (+ حزمة تحديث موقّعة)"
        run: npm run tauri build -- --target aarch64-apple-darwin

      # نفس الهدف ونفس البروفايل ⇒ يعيد استخدام مخرجات البناء (بلا compile ثاني)
      - name: "🧪 اختبارات الخلفية (شامل محاكاة macOS)"
        run: cargo test --release --lib --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml

      - name: "🛡️ فحص: لا اعتماد على مكتبات خارج النظام"
        run: |
          set -euo pipefail
          BIN=src-tauri/target/aarch64-apple-darwin/release/jisr
          test -f "$BIN" || { echo "::error::الملف التنفيذي غير موجود — مسار الفحص خاطئ!"; exit 1; }
          echo "== المكتبات الديناميكية =="
          DEPS=$(otool -L "$BIN")
          echo "$DEPS"
          BAD=$(echo "$DEPS" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::مكتبات غير نظامية مرصودة: $(echo "$BAD" | tr '\n' ' ')"
            echo "التطبيق يعتمد على مكتبة من خارج مكتبات النظام — أوقفنا النشر لمنع نسخة معطوبة!"
            exit 1
          fi
          DEPCOUNT=$(echo "$DEPS" | tail -n +2 | wc -l | tr -d ' ')
          echo "✔ كل الاعتمادات من مكتبات النظام (العدد: $DEPCOUNT)"
          echo "::notice::🛡️ فحص المكتبات نجح: $DEPCOUNT وصلة ديناميكية، كلها من مكتبات النظام | $BIN"

      - name: "🗂️ تجهيز ملفات النشر"
        run: |
          set -euo pipefail
          echo "== مخرجات البناء =="
          find src-tauri/target -maxdepth 6 \( -name '*.dmg' -o -name '*.app' -o -name '*.tar.gz' -o -name 'latest.json' \) -print
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' 2>/dev/null | head -n 1 || true)
          if [ -z "$DMG" ]; then
            echo "::warning::ما لقينا dmg في المسار المتوقع — نبحث في كل مجلد target"
            DMG=$(find src-tauri/target -type f -name '*.dmg' | head -n 1 || true)
          fi
          test -n "$DMG" || { echo "::error::لم ينتج البناء أي ملف dmg — توقف النشر!"; exit 1; }
          SIZE=$(( $(stat -f%z "$DMG") / 1048576 ))
          mkdir -p dist
          cp "$DMG" dist/
          # حزمة التحديث الموقّعة + توقيعها (Tauri ينشئ .sig فقط، ولا ينشئ latest.json)
          APPTGZ=$(find src-tauri/target -type f -name '*.app.tar.gz' | head -n 1 || true)
          if [ -n "$APPTGZ" ]; then cp "$APPTGZ" dist/; else echo "::error::ما لقينا حزمة التحديث (.app.tar.gz) — توقف النشر!"; exit 1; fi
          SIG=$(find src-tauri/target -type f -name '*.app.tar.gz.sig' | head -n 1 || true)
          if [ -z "$SIG" ]; then
            echo "::error::ما لقينا توقيع حزمة التحديث (.sig) — المفتاح الخاص غير متاح في CI؟ توقف النشر!"
            exit 1
          fi
          echo "== التوقيع =="; head -c 120 "$SIG"; echo
          # نولّد latest.json بأنفسنا: الإصدار من tauri.conf.json + التوقيع الفعلي + رابط الوسم
          export SIG_PATH="$SIG"
          export APP_ASSET="$(basename "$APPTGZ")"
          node - <<'NODE'
          const fs = require('fs');
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const sig = fs.readFileSync(process.env.SIG_PATH, 'utf8').trim();
          const tag = process.env.GITHUB_REF_NAME;
          const manifest = {
            version: conf.version,
            notes: `Jisr ${tag} — نسخة اختبار موقّعة`,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': {
                signature: sig,
                url: `https://github.com/Whoismelv/Jisr/releases/download/${tag}/${process.env.APP_ASSET}`,
              },
            },
          };
          fs.writeFileSync('dist/latest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log('manifest version:', manifest.version);
          console.log('manifest url:', manifest.platforms['darwin-aarch64'].url);
          console.log('signature lines:', sig.split('\n').length);
          NODE
          echo "== بيان التحديث =="
          cat dist/latest.json
          ls -la dist/
          echo "::notice::✔ جاهز للنشر: $(basename "$DMG") (${SIZE}MB)"

      - name: "📤 رفع الملفات لوظيفة النشر"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jisr-release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # ============================================================
  # 2) تدقيق تبعيات Rust (تعمل بالتوازي مع البناء — بوابة أمان)
  # ============================================================
  audit:
    name: "تدقيق تبعيات Rust"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache (مستودعات crates)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-target: false

      - name: "🛡️ Cache (أداة التدقيق)"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
          key: cargo-audit-bin-${{ runner.os }}-v1
          restore-keys: cargo-audit-bin-${{ runner.os }}-

      - name: "📅 تاريخ اليوم (مفتاح كاش يومي لقاعدة الثغرات)"
        id: day
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: "🛡️ Cache (قاعدة الثغرات — مرة كل يوم)"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ steps.day.outputs.value }}
          restore-keys: advisory-db-${{ runner.os }}-

      - name: "🛡️ تدقيق تبعيات Rust"
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cargo audit --file src-tauri/Cargo.lock

  # ============================================================
  # 3) النشر (ينتظر البناء + التدقيق — ما ينشر لو فيه ثغرة أو فشل)
  # ============================================================
  release:
    name: "نشر الإصدار"
    needs: [build, audit]
    # التشغيل اليدوي (workflow_dispatch) يبني ويختبر فقط — بدون نشر
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: "📥 جلب الملفات المبنية"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jisr-release
          path: dist

      - name: "📦 إنشاء الإصدار ورفع الملفات"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "جسر v0.1.0 — نسخة اختبار الماك ١٦ (DirectX 9 عبر DXVK · بناء أسرع)"
          # ملاحظة: لازم يكون غير prerelease حتى يشتغل مسار
          # /releases/latest/download/latest.json (GitHub يستثني الـprerelease من "latest")
          prerelease: false
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/latest.json
          body: |
            ## 🍎 نسخة اختبار الماك — النسخة ١٦ (DirectX 9 صار يشتغل · بناء أسرع)

            > 🎯 **DirectX 9 صار له مسار صحيح:** كان WineD3D يترجم شيدرات D3D9 إلى **GLSL**، ومُصرّف GLSL من **Apple** يرفضها (`Pixel shader error … E5000: syntax error`) ⇒ **الألعاب القديمة ما كانت تشتغل إطلاقاً**. الآن نضيف **`d3d9.dll` من DXVK** ⇒ المسار يصير **D3D9 → Vulkan → MoltenVK → Metal** (بلا GLSL نهائياً).
            > 🎮 **جديد في المكتبة:** زر **«نافذة»** بجانب كل لعبة (يمنع اللعبة من أخذ شاشة الماك كاملة = يمنع الشاشة السوداء).
            > 🩺 **السجل ما ينضيع:** بعد إعادة تشغيل الماك أو التطبيق، تلقى **سطور الجلسة السابقة** في صفحة السجل. ومخرجات تشغيل اللعبة صارت تُحفظ في `logs/game-launch.log` (كانت تضيع تماماً).
            > 🛡️ **حزام أمان للعرض:** نمنع اللعبة من تعتيم **شاشة الماك كلها** أو احتكارها بالوضع الكامل (`winemac.drv`: `AllowSetGamma=n` + `CaptureDisplaysForFullscreen=n`).
            > ⚡ **البناء صار أسرع بكثير:** `thin LTO` بدل `lto=true`، والاختبارات صارت بنفس بروفايل البناء (بلا compile مزدوج)، والتدقيق بقاعدة ثغرات مخزّنة، والوظائف متوازية. من **٧.٥ دقيقة** ≈ **٢-٣ دقائق**.
            > 🔄 **تحديث تلقائي:** من الإعدادات ← «تحقّق من التحديثات». التحديث **موقّع** بمفتاح minisign داخل التطبيق، فما يجيك إلا من بناء عندنا. بعد التثبيت: «أعد التشغيل الآن».
            > 🔒 بلا أي تتبّع تلقائي. لا تُسجَّل كلمة مرور ستيم.

            ### قبل ما تبدأ (متطلبات — مرة وحدة)
            1. **GStreamer** (متطلب محرّك Wine رسمياً — يحتاج كلمة سر الماك):
               **عندك نسخة مثبّتة؟ ما تحتاج تنزّل شي** — أي إصدار 1.x حديث يكفي. وإذا ما عندك:
               [gstreamer-1.0-1.28.8-universal.pkg](https://gstreamer.freedesktop.org/data/pkg/osx/1.28.8/gstreamer-1.0-1.28.8-universal.pkg)
               ℹ️ GStreamer للوسائط (فيديو/صوت) — الألعاب ثلاثية الأبعاد ما تحتاجه فعلياً.
               ✅ تتأكد من داخل التطبيق: **الرئيسية ← جاهزية النظام ← GStreamer** (يعرض الإصدار).
            2. **Rosetta 2:** يطلبه الماك تلقائياً عند أول تشغيل.

            ### أول تشغيل (مهم)
            1. نزّل الـdmg وافتحه
            2. اسحب **jisr** إلى مجلد **Applications**
            3. من Terminal (بلا كلمة سر): `xattr -cr /Applications/jisr.app`
            4. افتح التطبيق عادي — وبعدها التحديثات تصير تلقائية من داخله.

            ### رحلة التجربة
            1️⃣ نزّل المحرك → 2️⃣ جهّز القارورة الرئيسية → 3️⃣ ثبّت ستيم للويندوز → 4️⃣ سجّل دخولك (خلّ تحديث ستيم يخلص) → 5️⃣ نزّل **LIMBO Demo** (DirectX 9 — صار له مسار DXVK) → 6️⃣ من صفحة **المكتبة** شغّل اللعبة 🎮

            > 💡 **قبل الألعاب:** ستيم ← Settings ← In-Game ← أطفئ ✓ **Steam Overlay** (يتعارض مع DXVK).
            > 🪟 **إذا الشاشة سودا:** المكتبة ← زر **«نافذة»** ← ثم «تشغيل».
            > 🩺 **لو صار خطأ:** صفحة **السجل** ← «انسخ السجل كامل» ← أرسله لنا مع صورة.

            شكراً مقدماً 🌉
