# ============================================================
#  جسر — بناء نسخة الماك (Apple Silicon) على سيرفرات GitHub
#  • الناتج: ملف .dmg + إصدار (Release) جاهز للتنزيل
#  • التشغيل: من تبويب Actions (يدوي) أو بدفع وسم إصدار v*
#  • صيانة عند إصدار جديد: غيّر tag_name + الاسم تحت، ثم ادفع نفس الوسم
#  • حارس أمان: يفشّل البناء لو التطبيق اعتمد على مكتبة خارج مكتبات النظام
#    (درس أول تجربة حقيقية: liblzma من Homebrew سيرفر البناء)
# ============================================================
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  checks: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache (يبني أسرع)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: مكتبات الواجهة
        run: npm ci

      - name: "🛡️ فحص ثغرات حزم npm"
        run: npm audit --audit-level=high

      - name: "🛡️ فحص ثغرات تبعيات Rust"
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: "🧪 اختبارات الخلفية قبل البناء"
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: بناء التطبيق
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: "🛡️ فحص: لا اعتماد على مكتبات خارج النظام"
        run: |
          set -euo pipefail
          BIN=src-tauri/target/aarch64-apple-darwin/release/jisr
          test -f "$BIN" || { echo "::error::الملف التنفيذي غير موجود — مسار الفحص خاطئ!"; exit 1; }
          echo "== المكتبات الديناميكية =="
          DEPS=$(otool -L "$BIN")
          echo "$DEPS"
          BAD=$(echo "$DEPS" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::مكتبات غير نظامية مرصودة: $(echo "$BAD" | tr '\n' ' ')"
            echo "التطبيق يعتمد على مكتبة من خارج مكتبات النظام — أوقفنا النشر لمنع نسخة معطوبة!"
            exit 1
          fi
          DEPCOUNT=$(echo "$DEPS" | tail -n +2 | wc -l | tr -d ' ')
          echo "✔ كل الاعتمادات من مكتبات النظام (العدد: $DEPCOUNT)"
          echo "::notice::🛡️ فحص المكتبات نجح: $DEPCOUNT وصلة ديناميكية، كلها من مكتبات النظام | $BIN"

      - name: "🗂️ تجهيز ملف النشر"
        run: |
          set -euo pipefail
          echo "== مخرجات البناء =="
          find src-tauri/target -maxdepth 6 \( -name '*.dmg' -o -name '*.app' -o -name '*.tar.gz' \) -print
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' 2>/dev/null | head -n 1 || true)
          if [ -z "$DMG" ]; then
            echo "::warning::ما لقينا dmg في المسار المتوقع — نبحث في كل مجلد target"
            DMG=$(find src-tauri/target -type f -name '*.dmg' | head -n 1 || true)
          fi
          test -n "$DMG" || { echo "::error::لم ينتج البناء أي ملف dmg — توقف النشر!"; exit 1; }
          SIZE=$(( $(stat -f%z "$DMG") / 1048576 ))
          mkdir -p dist
          cp "$DMG" dist/
          echo "::notice::✔ جاهز للنشر: $(basename "$DMG") (${SIZE}MB)"

      - name: "📦 إنشاء الإصدار ورفع الـdmg"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.0-test.11
          name: "جسر v0.1.0 — نسخة اختبار الماك ١١ (تشخيص أعمق + مفتاح طوارئ لواجهة ستيم)"
          prerelease: true
          files: dist/*.dmg
          body: |
            ## 🍎 نسخة اختبار الماك — النسخة ١١ (تشخيص أعمق + مفتاح طوارئ)

            > 🩺 **الجديد:**
            > 1. **سجلات ستيم الرسمية داخل التقرير:** `webhelper.txt` (الفلاقين الحقيقية) · `bootstrap_log.txt` (تحقق الملفات) · `cef_log.txt` (أخطاء CEF) — أخطر ملفات وأهمها.
            > 2. **حكم سريع في التقرير:** سطر `cef_shim_flags_seen: single-process=… disable-gpu=…` يقول لك بصراحة هل غلافنا وصل لستيم أم لا.
            > 3. **تنظيف آمن لبقايا ستيم:** نعيد تسمية `htmlcache` و`Singleton*` القديمة (سبب موثّق لمشكلة «ستيم يفتح بدون نافذة») — بشرطين: ما فيه أي عملية ستيم حيّة، وإعادة تسمية لا حذف (كل شي قابل للتراجع).
            > 4. **🚨 مفتاح طوارئ بدون إعادة بناء:** ملف `~/Library/Application Support/Jisr/cef-flags.txt` — السطر الأول يغيّر فلاقين غلاف CEF، والثاني بصيغة `steam:-cef-single-process` يضيف وسائط لعميل ستيم. (لو واجهة ستيم ما ظهرت — راجع README/الرسالة المرفقة.)
            > 5. **GStreamer محدّث:** أحدث إصدار مستقر **1.28.8** (كنّا على 1.28.5).
            > 6. كل ميزات النسخ ٩ و١٠: سجل debug دائم يظهر داخل التطبيق + **«انسخ السجل كامل»** + **«إظهار في Finder»**.
            > 🔒 بلا أي تتبّع تلقائي — أنت اللي ترسل يدوياً. لا تُسجَّل كلمة مرور ستيم.
            > 🛡️ تتضمن كل تحصينات النسخ ٨–١٠: إصلاح Path Traversal + فحوص `cargo audit`/`npm audit` + Dependabot + Actions على SHA + `SECURITY.md`.

            ### قبل ما تبدأ (متطلبات — مرة وحدة)
            1. **GStreamer** (متطلب محرّك Wine رسمياً — لك وكل المستخدمين، يحتاج كلمة سر الماك):
               [gstreamer-1.0-1.28.8-universal.pkg](https://gstreamer.freedesktop.org/data/pkg/osx/1.28.8/gstreamer-1.0-1.28.8-universal.pkg)
               ℹ️ GStreamer للوسائط (فيديو/صوت) — الألعاب ثلاثية الأبعاد ما تحتاجه فعلياً، بس محرّك Gcenx يطلبه رسمياً.
            2. **Rosetta 2:** الماك يطلبه تلقائياً عند أول تشغيل — اضغط تثبيت (أو نفّذ: `softwareupdate --install-rosetta --agree-to-license`)

            ### أول تشغيل (مهم)
            1. نزّل الـdmg وافتحه
            2. اسحب **jisr** إلى مجلد **Applications**
            3. افتح **Terminal** ونفّذ (أضمن طريقة على الأنظمة الحديثة — يشيل «حجر صحي» آبل، بلا كلمة سر):
               `xattr -cr /Applications/jisr.app`
            4. بعدها افتح التطبيق عادي

            ### رحلة التجربة (داخل التطبيق)
            1️⃣ نزّل المحرك → 2️⃣ جهّز القارورة الرئيسية → 3️⃣ ثبّت ستيم للويندوز → 4️⃣ سجّل دخولك بحسابك → 5️⃣ نزّل **LIMBO Demo** و**Aperture Desk Job** → 6️⃣ من صفحة **المكتبة** شغّل اللعبة (ستيم لازم يكون شغّالاً) 🎮

            > 💡 **قبل تشغيل الألعاب:** من إعدادات ستيم ← In-Game ← أزل ✓ **Steam Overlay** (يتعارض مع DXVK وقد يسبب انهيار).
            > 💡 بعد تجهيز المحرك، انتظر ثوانٍ حتى ينزل DXVK (2.8MB). لو صارت مشكلة في لعبة، بدّل الطبقة إلى **WineD3D** من الإعدادات وأعد تشغيل ستيم.

            ### بعد التجربة
            من صفحة **السجل** اضغط **«انسخ السجل كامل»** وأرسل التقرير مع أي ملاحظة أو صورة. شكراً مقدماً 🌉
