# ============================================================
#  جسر — بناء نسخة الماك (Apple Silicon) على سيرفرات GitHub
#  • الناتج: ملف .dmg + إصدار (Release) جاهز للتنزيل
#  • التشغيل: من تبويب Actions (يدوي) أو بدفع وسم إصدار v*
#  • صيانة عند إصدار جديد: غيّر tag_name + الاسم تحت، ثم ادفع نفس الوسم
#  • حارس أمان: يفشّل البناء لو التطبيق اعتمد على مكتبة خارج مكتبات النظام
#    (درس أول تجربة حقيقية: liblzma من Homebrew سيرفر البناء)
# ============================================================
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  checks: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache (يبني أسرع)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: مكتبات الواجهة
        run: npm ci

      - name: "🛡️ فحص ثغرات حزم npm"
        run: npm audit --audit-level=high

      - name: "🛡️ فحص ثغرات تبعيات Rust"
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: "🧪 اختبارات الخلفية قبل البناء"
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: بناء التطبيق
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: "🛡️ فحص: لا اعتماد على مكتبات خارج النظام"
        run: |
          set -euo pipefail
          BIN=src-tauri/target/aarch64-apple-darwin/release/jisr
          test -f "$BIN" || { echo "::error::الملف التنفيذي غير موجود — مسار الفحص خاطئ!"; exit 1; }
          echo "== المكتبات الديناميكية =="
          DEPS=$(otool -L "$BIN")
          echo "$DEPS"
          BAD=$(echo "$DEPS" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::مكتبات غير نظامية مرصودة: $(echo "$BAD" | tr '\n' ' ')"
            echo "التطبيق يعتمد على مكتبة من خارج مكتبات النظام — أوقفنا النشر لمنع نسخة معطوبة!"
            exit 1
          fi
          DEPCOUNT=$(echo "$DEPS" | tail -n +2 | wc -l | tr -d ' ')
          echo "✔ كل الاعتمادات من مكتبات النظام (العدد: $DEPCOUNT)"
          echo "::notice::🛡️ فحص المكتبات نجح: $DEPCOUNT وصلة ديناميكية، كلها من مكتبات النظام | $BIN"

      - name: "🗂️ تجهيز ملف النشر"
        run: |
          set -euo pipefail
          echo "== مخرجات البناء =="
          find src-tauri/target -maxdepth 6 \( -name '*.dmg' -o -name '*.app' -o -name '*.tar.gz' \) -print
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' 2>/dev/null | head -n 1 || true)
          if [ -z "$DMG" ]; then
            echo "::warning::ما لقينا dmg في المسار المتوقع — نبحث في كل مجلد target"
            DMG=$(find src-tauri/target -type f -name '*.dmg' | head -n 1 || true)
          fi
          test -n "$DMG" || { echo "::error::لم ينتج البناء أي ملف dmg — توقف النشر!"; exit 1; }
          SIZE=$(( $(stat -f%z "$DMG") / 1048576 ))
          mkdir -p dist
          cp "$DMG" dist/
          echo "::notice::✔ جاهز للنشر: $(basename "$DMG") (${SIZE}MB)"

      - name: "📦 إنشاء الإصدار ورفع الـdmg"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.0-test.8
          name: "جسر v0.1.0 — نسخة اختبار الماك ٨ (تحصين أمني + فحوص تلقائية)"
          prerelease: true
          files: dist/*.dmg
          body: |
            ## 🍎 نسخة اختبار الماك — النسخة ٨ (تحصين أمني + فحوص تلقائية)

            > 🛡️ **هذه نسخة تحصين — بلا تغيير وظيفي.** نفس ميزات النسخة ٧ بالضبط:
            > 1. **إصلاح ثغرة حقيقية (Path Traversal):** أوامر حذف/إعادة تجهيز القوارير كانت تقبل معرّفاً خاماً — الآن تحقق صارم (`a-z` و`0-9` و`-` و`_` فقط، حد 64 حرفاً) يمنع أي خروج عن مجلد القوارير، مع اختبارات `../` و`\` وNUL.
            > 2. **حراسة إضافية:** قائمة القوارير تتجاهل أي مجلد غريب، ومعرّف القارورة في تشغيل الألعاب يمر بنفس الحارس الموحّد.
            > 3. **فحوص أمنية تلقائية في CI:** `cargo audit` + `npm audit` يفشلان البناء عند ثغرة معروفة، وفحص أسبوعي مجدول، وDependabot للتبعيات.
            > 4. **تثبيت كل GitHub Actions على SHA** (ضد استبدال الوسوم) + فحص بصمة غلاف CEF داخل الاختبارات + حدود لسجل الواجهة.
            > 5. **`SECURITY.md`:** سياسة إفصاح مسؤولة واضحة + نموذج الأمان والقيود المعروفة بصراحة.
            > 🔒 كل أصل بتحقّق SHA-256، نطاقات HTTPS صارمة، بلا shell، بلا sudo، بلا تتبّع.
            > ℹ️ DirectX 12 غير مدعوم بعد. D3D9 (LIMBO) يبقى على WineD3D، وD3D11 (Aperture Desk Job) يستخدم DXVK. **ما نعد بأرقام FPS** — القياس الميداني على الماك هو الحكم.

            ### قبل ما تبدأ (متطلبات — مرة وحدة)
            1. **GStreamer** (متطلب محرّك Wine رسمياً — لك وكل المستخدمين، يحتاج كلمة سر الماك):
               [gstreamer-1.0-1.28.5-universal.pkg](https://gstreamer.freedesktop.org/data/pkg/osx/1.28.5/gstreamer-1.0-1.28.5-universal.pkg)
            2. **Rosetta 2:** الماك يطلبه تلقائياً عند أول تشغيل — اضغط تثبيت (أو نفّذ: `softwareupdate --install-rosetta --agree-to-license`)

            ### أول تشغيل (مهم)
            1. نزّل الـdmg وافتحه
            2. اسحب **jisr** إلى مجلد **Applications**
            3. افتح **Terminal** ونفّذ (أضمن طريقة على الأنظمة الحديثة — يشيل «حجر صحي» آبل، بلا كلمة سر):
               `xattr -cr /Applications/jisr.app`
            4. بعدها افتح التطبيق عادي؛ وإذا ظهرت أي مشكلة — أرسل لنا صورة 🌉

            ### رحلة التجربة (داخل التطبيق)
            1️⃣ نزّل المحرك → 2️⃣ جهّز القارورة الرئيسية → 3️⃣ ثبّت ستيم للويندوز → 4️⃣ سجّل دخولك بحسابك → 5️⃣ نزّل **LIMBO Demo** و**Aperture Desk Job** → 6️⃣ من صفحة **المكتبة** شغّل اللعبة (ستيم لازم يكون شغّالاً) 🎮

            > 💡 بعد تجهيز المحرك، انتظر ثوانٍ حتى ينزل DXVK (2.8MB). تقدر تتأكد من **الإعدادات → طبقة الرسومات**: «تلقائي» مع DXVK جاهز. لو صارت مشكلة في لعبة، بدّلها إلى **WineD3D** وجرّب.

            ### بعد التجربة
            من صفحة **السجل** اضغط **«انسخ التقرير»** وأرسله — مع أي ملاحظة أو صورة. شكراً مقدماً 🌉
