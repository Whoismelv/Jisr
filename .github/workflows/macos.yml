# ============================================================
#  جسر — بناء نسخة الماك (Apple Silicon) على سيرفرات GitHub
#  • الناتج: ملف .dmg + إصدار (Release) جاهز للتنزيل
#  • التشغيل: من تبويب Actions (يدوي) أو بدفع وسم إصدار v*
# ============================================================
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache (يبني أسرع)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: مكتبات الواجهة
        run: npm ci

      - name: بناء التطبيق + إنشاء الإصدار
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          tagName: v0.1.0-test.1
          releaseName: "جسر v0.1.0 — نسخة اختبار الماك (Apple Silicon)"
          prerelease: true
          releaseBody: |
            ## 🍎 أول نسخة اختبار على الماك

            **ما هو؟** «جسر» — تطبيق يخليك تشغّل ألعاب ويندوز (ستيم) على ماك آبل سيليكون، بضغطات معدودة وبلا Terminal.

            ### التنزيل
            نزّل ملف **`.dmg`** من قسم Assets تحت 👇

            ### قبل ما تبدأ (متطلبات — مرة وحدة)
            1. **GStreamer** (متطلب محرّك Wine رسمياً — لك وكل المستخدمين، يحتاج كلمة سر الماك):
               [gstreamer-1.0-1.28.5-universal.pkg](https://gstreamer.freedesktop.org/data/pkg/osx/1.28.5/gstreamer-1.0-1.28.5-universal.pkg)
            2. **Rosetta 2:** الماك يطلبه تلقائياً عند أول تشغيل — اضغط تثبيت (أو نفّذ: `softwareupdate --install-rosetta --agree-to-license`)

            ### أول تشغيل (مهم)
            1. نزّل الـdmg وافتحه
            2. اسحب **jisr** إلى مجلد **Applications**
            3. افتح **Terminal** ونفّذ هذا الأمر (أضمن طريقة على الأنظمة الحديثة — يشيل «حجر صحي» آبل، بلا كلمة سر):
               `xattr -cr /Applications/jisr.app`
            4. بعدها افتح التطبيق عادي؛ وإذا ظهرت رسالة **«jisr is damaged»** رغم كل هذا — ارجع لهذي الرسالة وأرسل لنا صورة 🌉

            ### رحلة التجربة (داخل التطبيق)
            1️⃣ نزّل المحرك → 2️⃣ جهّز القارورة الرئيسية → 3️⃣ ثبّت ستيم للويندوز → 4️⃣ سجّل دخولك بحسابك → 5️⃣ نزّل **LIMBO Demo** والعب 🎮

            ### بعد التجربة
            من صفحة **السجل** اضغط **«انسخ التقرير»** وأرسله — مع أي ملاحظة أو صورة. شكراً مقدماً 🌉
