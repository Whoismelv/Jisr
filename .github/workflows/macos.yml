# ============================================================
#  جسر — بناء نسخة الماك (Apple Silicon) على سيرفرات GitHub
#  • الناتج: ملف .dmg + إصدار (Release) جاهز للتنزيل
#  • التشغيل: من تبويب Actions (يدوي) أو بدفع وسم إصدار v*
#  • صيانة عند إصدار جديد: غيّر tag_name + الاسم تحت، ثم ادفع نفس الوسم
#  • حارس أمان: يفشّل البناء لو التطبيق اعتمد على مكتبة خارج مكتبات النظام
#    (درس أول تجربة حقيقية: liblzma من Homebrew سيرفر البناء)
# ============================================================
name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache (يبني أسرع)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: مكتبات الواجهة
        run: npm ci

      - name: بناء التطبيق
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: "🛡️ فحص: لا اعتماد على مكتبات خارج النظام"
        run: |
          set -euo pipefail
          BIN=src-tauri/target/aarch64-apple-darwin/release/jisr
          test -f "$BIN" || { echo "::error::الملف التنفيذي غير موجود — مسار الفحص خاطئ!"; exit 1; }
          echo "== المكتبات الديناميكية =="
          DEPS=$(otool -L "$BIN")
          echo "$DEPS"
          BAD=$(echo "$DEPS" | tail -n +2 | grep -Ev '^[[:space:]]*(/usr/lib/|/System/)' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::مكتبات غير نظامية مرصودة: $(echo "$BAD" | tr '\n' ' ')"
            echo "التطبيق يعتمد على مكتبة من خارج مكتبات النظام — أوقفنا النشر لمنع نسخة معطوبة!"
            exit 1
          fi
          DEPCOUNT=$(echo "$DEPS" | tail -n +2 | wc -l | tr -d ' ')
          echo "✔ كل الاعتمادات من مكتبات النظام (العدد: $DEPCOUNT)"
          echo "::notice::🛡️ فحص المكتبات نجح: $DEPCOUNT وصلة ديناميكية، كلها من مكتبات النظام | $BIN"

      - name: "🗂️ تجهيز ملف النشر"
        run: |
          set -euo pipefail
          echo "== مخرجات البناء =="
          find src-tauri/target -maxdepth 6 \( -name '*.dmg' -o -name '*.app' -o -name '*.tar.gz' \) -print
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' 2>/dev/null | head -n 1 || true)
          if [ -z "$DMG" ]; then
            echo "::warning::ما لقينا dmg في المسار المتوقع — نبحث في كل مجلد target"
            DMG=$(find src-tauri/target -type f -name '*.dmg' | head -n 1 || true)
          fi
          test -n "$DMG" || { echo "::error::لم ينتج البناء أي ملف dmg — توقف النشر!"; exit 1; }
          SIZE=$(( $(stat -f%z "$DMG") / 1048576 ))
          mkdir -p dist
          cp "$DMG" dist/
          echo "::notice::✔ جاهز للنشر: $(basename "$DMG") (${SIZE}MB)"

      - name: "📦 إنشاء الإصدار ورفع الـdmg"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-test.5
          name: "جسر v0.1.0 — نسخة اختبار الماك ٥ (إصلاح شاشة ستيم السوداء)"
          prerelease: true
          files: dist/*.dmg
          body: |
            ## 🍎 نسخة اختبار الماك — النسخة ٥ (إصلاح شاشة ستيم السوداء)

            > 🔧 **الجديد في هالنسخة (من تشخيص تقرير ستيم الميداني):**
            > 1. **إصلاح «الشاشة السوداء» لستيم** — أضفنا أعلام CEF الرسمية من Valve (`-cef-disable-gpu` + `-cef-disable-gpu-compositing`): نفس الحل المعتمد لمشكلة واجهة ستيم السوداء على CrossOver/Whisky
            > 2. **سجل تشخيصي دائم** — كل تشغيل لستيم يكتب كلامه الكامل في `logs/steam-last-run.log` (يبقى محفوظاً حتى لو أوقفت ستيم يدوياً)
            > 3. **إصلاحات المراجعة الشاملة** — إلغاء التنزيل يتفاعل بسرعة حتى وقت التوقف + لكل لعبة ملف سجل خاص
            > (تشمل إصلاحات النسخة ٤: توقيع ذاتي + ضغط مدمج + حارس مكتبات + رفع مؤكَّد)

            ### قبل ما تبدأ (متطلبات — مرة وحدة)
            1. **GStreamer** (متطلب محرّك Wine رسمياً — لك وكل المستخدمين، يحتاج كلمة سر الماك):
               [gstreamer-1.0-1.28.5-universal.pkg](https://gstreamer.freedesktop.org/data/pkg/osx/1.28.5/gstreamer-1.0-1.28.5-universal.pkg)
            2. **Rosetta 2:** الماك يطلبه تلقائياً عند أول تشغيل — اضغط تثبيت (أو نفّذ: `softwareupdate --install-rosetta --agree-to-license`)

            ### أول تشغيل (مهم)
            1. نزّل الـdmg وافتحه
            2. اسحب **jisr** إلى مجلد **Applications**
            3. افتح **Terminal** ونفّذ (أضمن طريقة على الأنظمة الحديثة — يشيل «حجر صحي» آبل، بلا كلمة سر):
               `xattr -cr /Applications/jisr.app`
            4. بعدها افتح التطبيق عادي؛ وإذا ظهرت أي مشكلة — أرسل لنا صورة 🌉

            ### رحلة التجربة (داخل التطبيق)
            1️⃣ نزّل المحرك → 2️⃣ جهّز القارورة الرئيسية → 3️⃣ ثبّت ستيم للويندوز → 4️⃣ سجّل دخولك بحسابك → 5️⃣ نزّل **LIMBO Demo** والعب 🎮

            ### بعد التجربة
            من صفحة **السجل** اضغط **«انسخ التقرير»** وأرسله — مع أي ملاحظة أو صورة. شكراً مقدماً 🌉
