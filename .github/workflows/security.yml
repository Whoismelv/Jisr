# ============================================================
#  جسر — فحص أمني دوري للتبعيات
#  • أسبوعياً (اثنين 03:00 UTC) + يدوي + عند تغيّر ملفات القفل
#  • Rust: cargo-audit عبر rustsec/audit-check (يفشل عند ثغرة معروفة)
#  • npm: npm audit --audit-level=high
# ============================================================
name: Security audit

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "tools/steamwebhelper-shim/Cargo.toml"
      - "tools/steamwebhelper-shim/Cargo.lock"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  cargo-audit-jisr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: فحص حزم Rust — جسر
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  cargo-audit-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: فحص حزم Rust — غلاف CEF
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: tools/steamwebhelper-shim

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: فحص حزم npm (عالي/حرج)
        run: npm audit --audit-level=high
